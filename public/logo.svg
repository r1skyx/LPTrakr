<svg
  width="200" height="200"
  viewBox="35 35 130 130"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
>
  <!-- Stylized LP Representation with Three Grooves -->
  <circle cx="100" cy="100" r="60" fill="black" stroke="#333" stroke-width="5" />
  <circle cx="100" cy="100" r="40" fill="black" stroke="#555" stroke-width="4" />
  <circle cx="100" cy="100" r="20" fill="black" stroke="#777" stroke-width="3" />
  
  <!-- Center Label with Glow Effect -->
  <circle cx="100" cy="100" r="8" fill="#FACC15" filter="url(#glow)" />
  
  <!-- Vibrant Sound Waves -->
  <!-- Outer Wave -->
  <path d="M40 100 Q60 60, 100 60 Q140 60, 160 100 Q140 140, 100 140 Q60 140, 40 100 Z" stroke="#FF8000" stroke-width="6" fill="none" />
  <!-- Middle Wave -->
  <path d="M50 100 Q70 70, 100 70 Q130 70, 150 100 Q130 130, 100 130 Q70 130, 50 100 Z" stroke="#00C030" stroke-width="4" fill="none" />
  <!-- Inner Wave -->
  <path d="M60 100 Q80 80, 100 80 Q120 80, 140 100 Q120 120, 100 120 Q80 120, 60 100 Z" stroke="#0090FF" stroke-width="2" fill="none" />
  
  <!-- Glow Filter for Center Label -->
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
</svg>